[env:bap_node]
extends = Heltec_E290_base
build_flags =
  ${Heltec_E290_base.build_flags}
  -D DISPLAY_CLASS=E290Display
  -D FIRMWARE_ROLE='"bap_node"'
  -D ADVERT_NAME='"BAP Node"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  ; USA/Canada recommended preset (overrides esp32_base defaults)
  -D LORA_FREQ=910.525
  -D LORA_BW=62.5
  -D LORA_SF=7
  -D LORA_CR=5
  -D LORA_TX_POWER=22
  ; BAP app defaults
  -D BAP_POLL_INTERVAL_SEC=60
build_src_filter = ${Heltec_E290_base.build_src_filter}
  +<helpers/ui/E290Display.cpp>
  +<helpers/esp32/*.cpp>
  +<../examples/bap_node>
lib_deps =
  ${Heltec_E290_base.lib_deps}
  ${esp32_ota.lib_deps}
  bakercp/CRC32 @ ^2.0.0
  bblanchon/ArduinoJson @ ^7.0.0
